name: Feed-Test (temporär)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          from playwright.sync_api import sync_playwright
          URL = "https://worldoftanks.eu/de/rss/news/"
          with sync_playwright() as p:
              for headless in (True,):
                  b = p.chromium.launch(headless=headless, args=["--disable-blink-features=AutomationControlled"])
                  ctx = b.new_context(locale="de-DE", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36")
                  page = ctx.new_page()
                  resp = page.goto(URL, wait_until="load", timeout=60000)
                  for i in range(12):
                      page.wait_for_timeout(2500)
                      print(i, page.title()[:60], "|", page.url)
                      if "please wait" not in page.title().lower():
                          break
                  print("cookies:", [c["name"] for c in ctx.cookies()])
                  r = ctx.request.get(URL)
                  body = r.body()
                  print("request.get:", r.status, r.headers.get("content-type"), len(body))
                  print(body[:400])
                  b.close()
